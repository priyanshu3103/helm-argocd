apiVersion: v1
kind: ConfigMap
metadata:
  name: chartmuseum-config
  namespace: chartmuseum
data:
  # API Configuration - Set DISABLE_API to false (NOT true!)
  DISABLE_API: "false"
  ENABLE_API: "true"
  CHARTMUSEUM_ENABLE_API: "true"
  
  # Authentication
  AUTH_ANONYMOUS_GET: "true"
  CHARTMUSEUM_AUTH_ANONYMOUS_GET: "true"
  
  # Storage Configuration
  STORAGE: "local"
  STORAGE_LOCAL_ROOTDIR: "/charts"
  CHARTMUSEUM_STORAGE: "local"
  CHARTMUSEUM_STORAGE_LOCAL_ROOTDIR: "/charts"
  
  # Form field names
  CHART_POST_FORM_FIELD_NAME: "chart"
  PROV_POST_FORM_FIELD_NAME: "prov"
  
  # Logging
  LOG_JSON: "true"
  DEBUG: "true"