# Your chart uses these directly
replicaCount: 1
revisionHistoryLimit: 4
image:
  repository: ghcr.io/helm/chartmuseum
  tag: latest
  pullPolicy: IfNotPresent

# Persistence for charts
# persistence:
#   enabled: true
#   size: 10Gi
#   accessMode: ReadWriteOnce
#   storageClassName: standard

# Resource limits
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# In your chartmuseum app values
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/proxy-body-size: "100m"
  hosts:
    - host: chartmuseum.localhost
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: chartmuseum
              port:
                number: 8080