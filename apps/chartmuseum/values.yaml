# Your chart uses these directly
replicaCount: 1
revisionHistoryLimit: 4
# In your chartmuseum app values
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/proxy-body-size: "100m"
  hosts:
    - host: chartmuseum.localhost
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: chartmuseum
              port:
                number: 8080
deployment:
  # Override deployment spec
  spec:
    template:
      spec:
        containers:
          - name: chartmuseum
            image: ghcr.io/helm/chartmuseum:latest
            imagePullPolicy: IfNotPresent
            replicaCount: 1
            revisionHistoryLimit: 3
            envFrom:
              - configMapRef:
                  name: chartmuseum-config
            ports:
              - containerPort: 8080
                name: http
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi
            lifecycle:
              preStop:
                exec:
                  command: ["/bin/sh", "-c", "sleep 5"]
                postStart:
                  exec:
                    command: ["/bin/sh", "-c", "echo 'ChartMuseum is starting'"]
            startupProbe:
              httpGet:
                path: /health
                port: http