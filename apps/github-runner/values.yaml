replicaCount: 1
revisionHistoryLimit: 5

image:
  repository: summerwind/actions-runner-dind
  tag: "latest"
  pullPolicy: IfNotPresent
runner:
  githubUrl: "priyanshu3103/helm-charts"
  runnerName: "k8s-github-runner"
  labels: "k8s,self-hosted,linux"
  ephemeral: "true"
  replaceExistingRunner: "true"
  tokenSecretName: github-runner-secret
  tokenSecretKey: github_token
env:
  - name: RUNNER_NAME
    value: k8s-github-runner
  - name: GITHUB_URL
    value: priyanshu3103/helm-charts
  - name: RUNNER_ORG
    value: priyanshu3103
  - name: EPHEMERAL
    value: "true"
  - name: REPLACE_EXISTING_RUNNER
    value: "true"
  - name: RUNNER_TOKEN
    valueFrom:
      secretKeyRef:
        name: github-runner-secret
        key: runner-token