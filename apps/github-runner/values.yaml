replicaCount: 1
revisionHistoryLimit: 5

image:
  repository: myoung34/github-runner
  tag: "latest"
  pullPolicy: IfNotPresent
runner:
  orgName: "priyanshu-devops-release"
  runnerName: "k8s-github-runner"
  labels: "k8s,self-hosted,linux"
  ephemeral: "true"
  selfHosted: "true"
  scope: "org"
  replaceExistingRunner: "true"
  tokenSecretName: github-runner-secret
  tokenSecretKey: github_token
env:
  - name: RUNNER_NAME
    value: k8s-github-runner
  - name: ORG_NAME
    value: priyanshu3103
  - name: RUNNER_SCOPE
    value: "org"
  - name: RUN_AS_ROOT
    value: "false"
  - name: LABELS
    value: "k8s,self-hosted,linux"
  - name: RUNNER_WORKDIR
    value: /tmp/github-runner
  - name: ACCESS_TOKEN
    valueFrom:
      secretKeyRef:
        name: github-runner-secret
        key: github_token