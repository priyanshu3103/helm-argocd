runner:
  githubUrl: "https://github.com/priyanshu3103/helm-charts"
  runnerName: "k3d-runner"
  labels: "k3d,self-hosted,linux"
env: 
  - name: RUNNER_NAME
    value: github-runner
  - name: RUNNER_REPO
    value: priyanshu3103/*
  - name: RUNNER_TOKEN
    valueFrom:
      secretKeyRef:
        name: github-runner-secret
        key: runner-token